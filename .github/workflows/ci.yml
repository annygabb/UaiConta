name: UaiConta V4 CI

on:
  push:
    branches: [main, feat/uaiconta-v4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase without applying incremental migrations
        run: |
          mkdir -p /tmp/uaiconta-migrations
          mv supabase/migrations/*.sql /tmp/uaiconta-migrations/
          supabase start
      - name: Apply schema and migrations
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
          for migration in /tmp/uaiconta-migrations/*.sql; do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          mv /tmp/uaiconta-migrations/*.sql supabase/migrations/
      - name: Database tests
        run: supabase test db
      - name: Database lint
        run: supabase db lint --local --level warning
      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Security baseline
        run: npm run test:security
      - name: Build
        env:
          VITE_ENABLE_DEMO_MODE: 'true'
        run: npm run build
      - name: Dependency audit
        run: npm run audit
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Core E2E
        run: npm run test:e2e -- --project=desktop-chromium
      - name: Mobile E2E
        run: npm run test:e2e -- --project=mobile-chromium tests/e2e/uaiconta.spec.js
      - name: Safari PDF import
        run: npm run test:e2e -- --project=mobile-webkit tests/e2e/pdf-import-webkit.spec.js
      - name: Responsive matrix
        run: npm run test:responsive -- --project=desktop-chromium
      - name: Accessibility
        run: npm run test:a11y -- --project=desktop-chromium
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
